stages:
  - build
  - notify

build-job:
  stage: build
  image: ubuntu:18.04
  before_script:
    # Установка необходимых зависимостей для 32-битной работы на Ubuntu
    - apt-get update && apt-get install -y wget unzip libc6-i386 lib32stdc++6
    
    # Скачивание компилятора
    - wget https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
    - tar -xvf pawnc-3.10.10-linux.tar.gz
    
    # Настройка путей
    - export PATH=$PATH:$(pwd)/pawnc-3.10.10-linux/bin
    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/pawnc-3.10.10-linux/lib

  script:
    - mkdir -p gamemodes npcmodes plugins scriptfiles
    
    # Основная команда компиляции
    # Я убрал лишние кавычки, чтобы bash не путался
    - pawncc gamemodes/main.pwn -o"gamemodes/main.amx" -i"pawno/include" -i"gamemodes" "-;+"
    
  artifacts:
    name: "server_release"
    # Перечисляем только то, что реально нужно на сервере
    paths:
      - "gamemodes/*.amx"
      - "npcmodes/*.amx"
      - "plugins/*.so"
      - "scriptfiles/"
      - "server.cfg"
      - "samp03svr"
      - "*.so"  # Подхватит .so файлы из корня репозитория
    expire_in: 1 day

notify-bot-job:
  stage: notify
  image: curlimages/curl:latest
  script:
    # Замени IP на свой. Бот должен слушать порт 8080 (как мы обсуждали ранее)
    - curl -X POST http://72.62.3.235:6666/webhook/deploy
  dependencies:
    - build-job
  only:
    - test  # Выполнять только при пуше в основную ветку